name: Sensor Sync + Misting Alert

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:           # allow manual trigger from GitHub UI

jobs:
  sync-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv groq

      - name: Sync SmartSense to Turso
        continue-on-error: true   # alert must run even if sync fails
        env:
          TURSO_DATABASE_URL:  ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:    ${{ secrets.TURSO_AUTH_TOKEN }}
          DIDIKHUB_USERNAME:   ${{ secrets.DIDIKHUB_USERNAME }}
          DIDIKHUB_PASSWORD:   ${{ secrets.DIDIKHUB_PASSWORD }}
        run: python sync_sensor_job.py

      - name: Run misting alert
        env:
          TURSO_DATABASE_URL:  ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN:    ${{ secrets.TURSO_AUTH_TOKEN }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mist_alert.py
